name: nghttp2 version

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compare vendored and upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-nghttp2-version
