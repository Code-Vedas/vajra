name: Release
permissions:
  contents: read

on:
  push:
    tags:
      - v*

concurrency:
  group: release
  cancel-in-progress: true

env:
  RUBY_VERSION: 3.4.10

jobs:
  verify_release:
    name: Verify release
    permissions:
      contents: read
    uses: ./.github/workflows/shared-ci.yml
    secrets: inherit
    with:
      upload_coverage: false

  publish_vajra:
    name: Publish gems/vajra
    runs-on: ubuntu-latest
    needs: [verify_release]
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ${{ github.workspace }}/gems/vajra
      - name: Verify release tag matches gem version
        working-directory: ${{ github.workspace }}/gems/vajra
        run: |
          version=$(ruby -Ilib -rvajra/version -e 'print Vajra::VERSION')
          expected_tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release ref ${GITHUB_REF_NAME} does not match ${expected_tag}." >&2
            exit 1
          fi
      - name: Configure RubyGems Credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - name: Record build provenance
        run: scripts/write-build-provenance "${RUNNER_TEMP}/vajra-build-provenance.json"
      - name: Upload build provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vajra-build-provenance-${{ github.ref_name }}
          path: ${{ runner.temp }}/vajra-build-provenance.json
          if-no-files-found: error
      - name: Build and push gem
        working-directory: ${{ github.workspace }}/gems/vajra
        run: |
          gem build vajra.gemspec
          gem push vajra-*.gem
