name: Shared CI
permissions:
  contents: read
env:
  BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
  BUNDLE_JOBS: "4"
  BUNDLE_RETRY: "3"
  RUBY_VERSION: 3.4.10

on:
  workflow_call:
    inputs:
      upload_coverage:
        required: false
        type: boolean
        default: false
    secrets:
      QLTY_COVERAGE_TOKEN:
        required: false

jobs:
  dependency_audit:
    name: Bundler Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false
      - name: Install bundler-audit
        run: gem install bundler-audit --version 0.9.3 --no-document
      - name: Refresh advisory database
        run: bundler-audit update
      - name: Audit all Bundler lockfiles
        run: |
          bundler-audit check gems/vajra
          bundler-audit check gems/vajra/performance
          bundler-audit check docs
          bundler-audit check danger

  native_sanitizers:
    name: Native ASan and UBSan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake libssl-dev pkg-config
      - name: Run native sanitizer tests
        run: gems/vajra/bin/ctest-sanitized

  fuzz_native_parsers:
    name: Native parser libFuzzer
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Clang and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake libssl-dev pkg-config
      - name: Fuzz bounded native parser corpora
        env:
          FUZZ_RUNS: "1000"
        run: gems/vajra/bin/fuzz-native-parsers

  rubocop:
    name: RuboCop · Ruby 3.4
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake git libyaml-dev pkg-config
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - name: Restore bundle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: ${{ runner.os }}-ruby-3.4-bundle-${{ hashFiles('gems/vajra/Gemfile.lock', 'docs/Gemfile.lock', 'danger/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.4-bundle-
      - name: Install bundles
        run: scripts/ci-install-bundles
        env:
          CI_RUBY_VERSION: "3.4"
      - name: Run RuboCop
        run: scripts/run-rubocop-all

  reek:
    name: Reek and RBS · Ruby 3.4
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang git libyaml-dev pkg-config
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - name: Restore bundle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: ${{ runner.os }}-ruby-3.4-bundle-${{ hashFiles('gems/vajra/Gemfile.lock', 'docs/Gemfile.lock', 'danger/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.4-bundle-
      - name: Install bundles
        run: scripts/ci-install-bundles
        env:
          CI_RUBY_VERSION: "3.4"
      - name: Run Reek
        run: scripts/run-reek-all
      - name: Run C++ lint
        run: scripts/run-clint-all
      - name: Validate RBS
        run: scripts/run-rbs-all

  test:
    name: Unit Tests · ${{ matrix.os }} · Ruby ${{ matrix.ruby_version }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    needs: [dependency_audit, rubocop, reek]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby_version: "3.2"
          - os: ubuntu-latest
            ruby_version: "3.4"
          - os: ubuntu-latest
            ruby_version: "4.0"
          - os: macos-15
            ruby_version: "3.2"
          - os: macos-15
            ruby_version: "3.4"
          - os: macos-15
            ruby_version: "4.0"
          - os: windows-2022
            ruby_version: "3.2"
          - os: windows-2022
            ruby_version: "3.4"
          - os: windows-2022
            ruby_version: "4.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install apt packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake git libyaml-dev pkg-config
      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install cmake libyaml openssl@3 pkg-config
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: false
      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          ridk exec pacman --noconfirm --needed -S
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-libyaml
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-toolchain
          make
      - name: Restore bundle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: ${{ runner.os }}-ruby-${{ matrix.ruby_version }}-bundle-${{ hashFiles('gems/vajra/Gemfile.lock', 'docs/Gemfile.lock', 'danger/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-${{ matrix.ruby_version }}-bundle-
      - name: Install bundles
        if: runner.os == 'Linux'
        run: scripts/ci-install-bundles
        env:
          CI_RUBY_VERSION: ${{ matrix.ruby_version }}
      - name: Install macOS bundle
        if: runner.os == 'macOS'
        working-directory: gems/vajra
        run: bundle install --jobs 4 --retry 3
      - name: Install Windows bundle and compile
        if: runner.os == 'Windows'
        working-directory: gems/vajra
        env:
          VAJRA_TEST_FAULT_INJECTION: "1"
        run: |
          bundle install --jobs 4 --retry 3
          ridk exec bundle exec rake clobber compile
      - name: Run unit tests
        shell: bash
        env:
          VAJRA_TEST_FAULT_INJECTION: "1"
        run: scripts/run-rspec-unit-all
      - name: Publish coverage to Qlty
        if: inputs.upload_coverage && runner.os == 'Linux' && matrix.ruby_version == '3.4'
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: |
            ${{ github.workspace }}/gems/vajra/coverage/.resultset.json

  test_e2e:
    name: E2E Tests · ${{ matrix.os }} · Ruby ${{ matrix.ruby_version }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    needs: [dependency_audit, rubocop, reek]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby_version: "3.2"
          - os: ubuntu-latest
            ruby_version: "3.4"
          - os: ubuntu-latest
            ruby_version: "4.0"
          - os: macos-15
            ruby_version: "3.2"
          - os: macos-15
            ruby_version: "3.4"
          - os: macos-15
            ruby_version: "4.0"
          - os: windows-2022
            ruby_version: "3.2"
          - os: windows-2022
            ruby_version: "3.4"
          - os: windows-2022
            ruby_version: "4.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install apt packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential git libyaml-dev pkg-config
      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install libyaml openssl@3 pkg-config
      - name: Install h2spec
        if: runner.os == 'Linux'
        env:
          H2SPEC_VERSION: v2.6.0
          H2SPEC_SHA256: 157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318
        run: |
          archive="${RUNNER_TEMP}/h2spec_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/summerwind/h2spec/releases/download/${H2SPEC_VERSION}/h2spec_linux_amd64.tar.gz"
          echo "${H2SPEC_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" h2spec
          sudo install --mode 0755 "${RUNNER_TEMP}/h2spec" /usr/local/bin/h2spec
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: false
      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          ridk exec pacman --noconfirm --needed -S
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-libyaml
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-toolchain
          make
      - name: Restore bundle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: ${{ runner.os }}-ruby-${{ matrix.ruby_version }}-bundle-${{ hashFiles('gems/vajra/Gemfile.lock', 'docs/Gemfile.lock', 'danger/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-${{ matrix.ruby_version }}-bundle-
      - name: Install bundles
        if: runner.os == 'Linux'
        run: scripts/ci-install-bundles
        env:
          CI_RUBY_VERSION: ${{ matrix.ruby_version }}
      - name: Install macOS bundle
        if: runner.os == 'macOS'
        working-directory: gems/vajra
        run: bundle install --jobs 4 --retry 3
      - name: Install Windows bundle and compile
        if: runner.os == 'Windows'
        working-directory: gems/vajra
        env:
          VAJRA_TEST_FAULT_INJECTION: "1"
        run: |
          bundle install --jobs 4 --retry 3
          ridk exec bundle exec rake clobber compile
      - name: Run e2e tests
        shell: bash
        env:
          VAJRA_TEST_FAULT_INJECTION: "1"
          NO_COVERAGE: "1"
        run: scripts/run-rspec-e2e-all
      - name: Run HTTP/2 h2spec conformance tests
        if: runner.os == 'Linux'
        run: scripts/run-h2spec-all

  build_package:
    name: Build Package
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [dependency_audit, rubocop, reek]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake git libyaml-dev pkg-config
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false
      - name: Restore bundle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: ${{ runner.os }}-ruby-${{ env.RUBY_VERSION }}-bundle-${{ hashFiles('gems/vajra/Gemfile.lock', 'docs/Gemfile.lock', 'danger/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-${{ env.RUBY_VERSION }}-bundle-
      - name: Install bundles
        run: scripts/ci-install-bundles
        env:
          CI_RUBY_VERSION: ${{ env.RUBY_VERSION }}
      - name: Build package
        run: scripts/run-package-build-all
      - name: Run native C++ tests
        run: scripts/run-ctest-all

  build_docs:
    name: Build Docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [dependency_audit, rubocop, reek]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential git libyaml-dev pkg-config
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false
      - name: Restore bundle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: ${{ runner.os }}-ruby-${{ env.RUBY_VERSION }}-bundle-${{ hashFiles('gems/vajra/Gemfile.lock', 'docs/Gemfile.lock', 'danger/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-${{ env.RUBY_VERSION }}-bundle-
      - name: Install bundles
        run: scripts/ci-install-bundles
        env:
          CI_RUBY_VERSION: ${{ env.RUBY_VERSION }}
      - name: Build docs
        run: scripts/run-docs-build-all

  ci_finished:
    name: ci_finished
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [test, test_e2e]
    steps:
      - name: Confirm all tests passed
        run: echo "ci_finished"
